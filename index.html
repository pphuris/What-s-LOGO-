<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมทายรูปแบบ 2x2</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    margin: 0;
    background: #f9f9f9;
    padding: 20px;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 30px;
    color: #333;
    text-align: center;
  }

  .answers {
    display: grid;
    grid-template-columns: 150px 150px;
    grid-template-rows: 150px 150px;
    gap: 20px;
  }

  .answer-btn {
    border: none;
    border-radius: 12px;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
    background-color: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }

  .answer-btn img {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
  }

  .answer-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 12px rgba(0,0,0,0.25);
  }

  .answer-btn.correct {
    border: 4px solid #28a745;
  }

  .answer-btn.wrong {
    border: 4px solid #dc3545;
    opacity: 0.6;
  }

  #score {
    margin-top: 30px;
    font-size: 22px;
    font-weight: bold;
    color: #333;
  }

  @media (max-width: 500px) {
    .answers {
      grid-template-columns: 120px 120px;
      grid-template-rows: 120px 120px;
      gap: 15px;
    }
  }
</style>
</head>
<body>

<h1 id="question-text">คำถามที่นี่</h1>
<div class="answers" id="answers-container"></div>
<div id="score">คะแนน: 0</div>

<script>
// ตัวอย่างคำถาม Text + คำตอบเป็นรูป (Base64)
const questions = [
  {
    text: "WHAT'S THE APPLE LOGO ?",
    answers: [
      { 
        img: "https://lh3.googleusercontent.com/d/1wzq03n242y_C4DdzIGVJnZSkkS7q9sd_?authuser=0", correct: false, bg: "#ffcccc" },
      { img: "https://lh3.googleusercontent.com/d/1B0NMjouTKLp7U5PzqDJRHKge5xaCoy3v?authuser=0", correct: true, bg: "#cce0ff" },
      { img: "https://lh3.googleusercontent.com/d/1WH5mjh9TeyseHSThrNE7_5ZeLDKssbRQ?authuser=0", correct: false, bg: "#ddffcc" },
      { img: "https://lh3.googleusercontent.com/d/1bwza7Mx5LmkZQ-r-Btc14kUGtHS8KYuA?authuser=0", correct: false, bg: "#ffe0cc" }
    ]
  },
  {
    text: "WHAT'S THE KCE LOGO ?",
    answers: [
      { img: "https://lh3.googleusercontent.com/d/1sfHGgQAngNbcKWmoytaxuVmpHV_lBTxc?authuser=0", correct: false, bg: "#ffcccc" },
      { img: "https://lh3.googleusercontent.com/d/15A4gGsopL1f3OqBI3V6JY99FD03yBjx9?authuser=0", correct: true, bg: "#cce0ff" },
      { img: "https://lh3.googleusercontent.com/d/1QTsOONo2Of14XeL_L5dkZc2K4vTvdnNh?authuser=0", correct: false, bg: "#ddffcc" },
      { img: "https://lh3.googleusercontent.com/d/1lJ6nEe0-dkGIMyBDk8TzN4CGxZIpMc-e?authuser=0", correct: false, bg: "#ffe0cc" }
    ]
  },
];

let currentQuestionIndex = 0;
let score = 0;
let startTime;

function showQuestion(index) {
  startTime = new Date().getTime();
  const q = questions[index];
  document.getElementById('question-text').textContent = q.text;
  const container = document.getElementById('answers-container');
  container.innerHTML = '';

  // สุ่มตำแหน่งคำตอบ
  const options = q.answers.sort(() => 0.5 - Math.random());

	options.forEach(opt => {
	  const btn = document.createElement('button');
	  btn.classList.add('answer-btn');
	  btn.style.backgroundColor = opt.bg;
	  btn.innerHTML = `<img src="${opt.img}" alt="คำตอบ">`;
	  btn.correct = opt.correct; // <-- เพิ่มตรงนี้
	  btn.onclick = () => checkAnswer(opt.correct, btn, options);
	  container.appendChild(btn);
	});

}

function checkAnswer(isCorrect, btn, options) {
  const endTime = new Date().getTime();
  const timeTaken = (endTime - startTime) / 1000;

  const allButtons = document.querySelectorAll('.answer-btn');

  allButtons.forEach(b => {
    b.onclick = null; // ป้องกันกดซ้ำ
    if(b.correct) {
      b.classList.add('correct'); // แสดงคำตอบถูก
    } 
    if(b === btn && !isCorrect) {
      b.classList.add('wrong'); // แสดงคำตอบผิด
    }
  });

  if(isCorrect) {
    const point = Math.max(10 - Math.floor(timeTaken), 1);
    score += point;
  }

  document.getElementById('score').textContent = `คะแนน: ${score}`;

  setTimeout(() => nextQuestion(), 1500);
}


function nextQuestion() {
  currentQuestionIndex++;
  if(currentQuestionIndex < questions.length) {
    showQuestion(currentQuestionIndex);
  } else {
    alert(`จบเกม! คะแนนรวม: ${score}`);
  }
}

// เริ่มเกม
showQuestion(currentQuestionIndex);
</script>

</body>
</html>

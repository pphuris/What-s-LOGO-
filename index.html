<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHAT'S THE REAL LOGO?</title>
<style>
	body {
	  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
	  display: flex;
	  flex-direction: column;
	  align-items: center;
	  justify-content: flex-start;
	  min-height: 100vh;
	  margin: 0;
	  padding: 30px 20px;
	  background-color: #EAF2F8; /* สีพื้นหลังฟ้าอ่อน */
	}

	/* คำถาม */
	h1#question-text {
	  font-size: 26px;
	  color: #1a1a1a;
	  margin-bottom: 25px;
	  text-align: center;
	  font-weight: 600;
	}

	/* กริดคำตอบ 2x2 */
	.answers {
	  display: grid;
	  grid-template-columns: repeat(2, 150px);
	  grid-template-rows: repeat(2, 150px);
	  gap: 20px;
	}

	/* ปุ่มคำตอบสี่เหลี่ยมพาสเทล */
	.answer-btn {
	  border: none;
	  border-radius: 15px;
	  cursor: pointer;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  transition: 0.2s ease;
	  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
	}

	/* สีปุ่มแต่ละตัวอย่าง */
	.answer-btn.bg-pink { background-color: #FADBD8; }
	.answer-btn.bg-blue { background-color: #D6EAF8; }
	.answer-btn.bg-green { background-color: #D5F5E3; }
	.answer-btn.bg-orange { background-color: #FCF3CF; }

	.answer-btn img {
	  width: 60%;
	  height: 60%;
	  object-fit: contain;
	}

	/* Hover */
	.answer-btn:hover {
	  transform: scale(1.05);
	  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
	}

	/* แสดงถูก/ผิด */
	.answer-btn.correct { border: 4px solid #28a745; }
	.answer-btn.wrong { border: 4px solid #dc3545; opacity: 0.7; }

	/* Score แถบด้านล่าง */
	#score {
	  margin-top: 30px;
	  padding: 10px 25px;
	  font-size: 20px;
	  font-weight: 500;
	  color: #1a1a1a;
	  border-radius: 12px;
	  background-color: #E1E8F0; /* สีคล้ายพื้น แต่เข้มกว่าเล็กน้อย */
	}

</style>
</head>
<body>

<h1 id="question-text">คำถามที่นี่</h1>
<div class="answers" id="answers-container"></div>
<div id="score">Score: 0</div>

<script>
// ตัวอย่างคำถาม Text + คำตอบเป็นรูป (Base64)
const questions = [
  {
    text: "WHAT'S THE APPLE LOGO ?",
    answers: [
      { 
        img: "https://lh3.googleusercontent.com/d/1wzq03n242y_C4DdzIGVJnZSkkS7q9sd_?authuser=0", correct: false, bg: "#ffcccc" },
      { img: "https://lh3.googleusercontent.com/d/1B0NMjouTKLp7U5PzqDJRHKge5xaCoy3v?authuser=0", correct: true, bg: "#cce0ff" },
      { img: "https://lh3.googleusercontent.com/d/1WH5mjh9TeyseHSThrNE7_5ZeLDKssbRQ?authuser=0", correct: false, bg: "#ddffcc" },
      { img: "https://lh3.googleusercontent.com/d/1bwza7Mx5LmkZQ-r-Btc14kUGtHS8KYuA?authuser=0", correct: false, bg: "#ffe0cc" }
    ]
  },
  {
    text: "WHAT'S THE GOOGLE LOGO ?",
    answers: [
      { img: "https://lh3.googleusercontent.com/d/1kCkUAOe4SFjhSwW2J1nOsNnQ5g14IqBw?authuser=0", correct: false, bg: "#ffcccc" },
      { img: "https://lh3.googleusercontent.com/d/1pSU9r6Y12Lem7kDhOAmc95D0eHGxX5aP?authuser=0", correct: true, bg: "#cce0ff" },
      { img: "https://lh3.googleusercontent.com/d/19rMIYQOfwJmwUermnrVgyoyFNzfniPjq?authuser=0", correct: false, bg: "#ddffcc" },
      { img: "https://lh3.googleusercontent.com/d/1kkE8Rwo5bwVgd3U7Wjx0tdEjBUEFJ-zY?authuser=0", correct: false, bg: "#ffe0cc" }
    ]
  },
];

// ก่อนหน้า
// let currentQuestionIndex = 0;

// สุ่มคำถาม
let shuffledQuestions = questions.sort(() => 0.5 - Math.random());
let currentQuestionIndex = 0;
let score = 0;
let startTime;

function showQuestion(index) {
  startTime = new Date().getTime();
  const q = shuffledQuestions[index]; // ใช้ shuffledQuestions แทน questions
  document.getElementById('question-text').textContent = q.text;
  const container = document.getElementById('answers-container');
  container.innerHTML = '';

  // สุ่มตำแหน่งคำตอบ
  const options = q.answers.sort(() => 0.5 - Math.random());

  const colorClasses = ["bg-pink", "bg-blue", "bg-green", "bg-orange"];

  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.classList.add('answer-btn');

    // ใส่สีจาก colorClasses โดยวนซ้ำถ้ามากกว่า 4 ตัวเลือก
    btn.classList.add(colorClasses[i % colorClasses.length]);

    btn.innerHTML = `<img src="${opt.img}" alt="คำตอบ">`;
    btn.correct = opt.correct;
    btn.onclick = () => checkAnswer(opt.correct, btn, options);

    container.appendChild(btn);
  });
}

function nextQuestion() {
  currentQuestionIndex++;
  if(currentQuestionIndex < shuffledQuestions.length) {
    showQuestion(currentQuestionIndex);
  } else {
    alert(`จบเกม! คะแนนรวม: ${score}`);
  }
}


// เริ่มเกม
showQuestion(currentQuestionIndex);
</script>

</body>
</html>

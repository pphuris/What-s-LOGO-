<title>เกมทายรูปแบบ 2x2</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    margin: 0;
    background: #f9f9f9;
    padding: 20px;
  }

  h1 {
    font-size: 28px;
    margin-bottom: 30px;
    color: #333;
    text-align: center;
  }

  .answers {
    display: grid;
    grid-template-columns: 150px 150px;
    grid-template-rows: 150px 150px;
    gap: 20px;
  }

  .answer-btn {
    border: none;
    border-radius: 12px;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
    background-color: #fff;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }

  .answer-btn img {
    max-width: 80%;
    max-height: 80%;
    object-fit: contain;
  }

  .answer-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 12px rgba(0,0,0,0.25);
  }

  .answer-btn.correct {
    border: 4px solid #28a745;
  }

  .answer-btn.wrong {
    border: 4px solid #dc3545;
    opacity: 0.6;
  }

  #score {
    margin-top: 30px;
    font-size: 22px;
    font-weight: bold;
    color: #333;
  }

  @media (max-width: 500px) {
    .answers {
      grid-template-columns: 120px 120px;
      grid-template-rows: 120px 120px;
      gap: 15px;
    }
  }
</style>
</head>

  const container = document.getElementById('answers-container');
  container.innerHTML = '';

  // สุ่มตำแหน่งคำตอบ
  const options = q.answers.sort(() => 0.5 - Math.random());

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.classList.add('answer-btn');
    btn.style.backgroundColor = opt.bg;
    btn.innerHTML = `<img src="${opt.img}" alt="คำตอบ">`;
    btn.onclick = () => checkAnswer(opt.correct, btn, options);
    container.appendChild(btn);
  });
}

function checkAnswer(isCorrect, btn, allButtons) {
  const endTime = new Date().getTime();
  const timeTaken = (endTime - startTime) / 1000;

  allButtons.forEach(b => {
    b.onclick = null; // ป้องกันกดซ้ำ
    if(b === btn && isCorrect) b.classList.add('correct');
    else if(b === btn && !isCorrect) b.classList.add('wrong');
    else if(b !== btn && b.innerHTML.includes('src') && b.style.backgroundColor === allButtons.find(a => a.correct).bg) {
      b.classList.add('correct');
    }
  });

  if(isCorrect) {
    const point = Math.max(10 - Math.floor(timeTaken), 1);
    score += point;
  }

  setTimeout(() => nextQuestion(), 1500);
  document.getElementById('score').textContent = `คะแนน: ${score}`;
}

function nextQuestion() {
  currentQuestionIndex++;
  if(currentQuestionIndex < questions.length) {
    showQuestion(currentQuestionIndex);
  } else {
    alert(`จบเกม! คะแนนรวม: ${score}`);
  }
}

// เริ่มเกม
showQuestion(currentQuestionIndex);
</script>
